
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>中国海洋资源 - 地理答题模块 + 数据大屏</title>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
    <style>
        /* 整体布局样式 */
        .main-container {
            display: flex;
            width: 100%;
            min-height: 100vh;
            gap: 20px;
            padding: 20px;
            box-sizing: border-box;
            background: #f5f5f5;
        }

        /* 左侧答题区域 */
        .quiz-section {
            flex: 1;
            min-width: 400px;
            max-width: 600px;
        }

        /* 右侧数据大屏区域 */
        .data-screen-section {
            flex: 1;
            min-width: 600px;
            background: #0a1929;
            color: #fff;
            border-radius: 16px;
            padding: 20px;
            box-sizing: border-box;
        }

        /* 基础样式重置 */
        *{margin:0;padding:0;box-sizing:border-box;}
        body{font-family:"Microsoft Yahei",sans-serif;}

        /* 答题容器样式 */
        .quiz-container {
            background: #fff;
            width: 100%;
            max-width: 100%;
            max-height: 90vh;
            border-radius: 16px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.1);
            padding: 20px 16px;
            margin: 0 auto;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
        }

        h1 {
            text-align: center;
            color: #1565c0;
            font-size: 20px;
            margin-bottom: 8px;
        }
        .subtitle {
            text-align: center;
            color: #777;
            font-size: 12px;
            margin-bottom: 16px;
        }
        .screen { display: none; }
        .screen.active { display: block; }
        .form-group { margin-bottom: 12px; }
        label {
            display: block;
            font-weight: 600;
            margin-bottom: 6px;
            color: #333;
            font-size: 14px;
        }
        input[type="text"] {
            width: 100%;
            padding: 8px 12px;
            border: 1.5px solid #cfd8dc;
            border-radius: 8px;
            font-size: 14px;
            transition: border-color 0.2s;
        }
        input[type="text"]:focus { outline: none; border-color: #1976d2; }
        .btn {
            background: #1976d2;
            color: #fff;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            transition: background 0.2s;
            white-space: nowrap;
        }
        .btn:hover { background: #1565c0; }
        .btn:disabled { background: #90a4ae; cursor: not-allowed; }
        .btn-secondary { background: #f5f5f5; color: #333; }
        .btn-back {background: #607d8b;}
        .btn-back:hover {background: #455a64;}
        .timer-bar {
            position: sticky;
            top: 0;
            background: #fff8e1;
            border: 1.5px solid #ffe082;
            border-radius: 10px;
            padding: 8px 12px;
            margin-bottom: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 10;
            flex-wrap: wrap;
            gap: 8px;
        }
        .timer-text { font-weight: 700; color: #ef6c00; font-size: 14px; }
        .progress { font-size: 12px; color: #666; }
        .question-card {
            background: #fafafa;
            border: 1px solid #eee;
            border-radius: 10px;
            padding: 12px 14px;
            margin-bottom: 12px;
        }
        .q-title {
            font-weight: 600;
            margin-bottom: 8px;
            font-size: 14px;
            line-height: 1.4;
        }
        .q-title .num { color: #1976d2; margin-right: 6px; }
        .options label {
            display: block;
            background: #fff;
            border: 1.5px solid #e0e0e0;
            border-radius: 8px;
            padding: 8px 10px;
            margin-bottom: 6px;
            cursor: pointer;
            font-weight: normal;
            transition: all 0.15s;
            font-size: 13px;
            line-height: 1.4;
        }
        .options label:hover { border-color: #1976d2; background: #e3f2fd; }
        .options input { margin-right: 8px; }
        /* 答题结果样式 */
        .options label.correct {
            background: #e8f5e9;
            border-color: #4caf50;
        }
        .options label.incorrect {
            background: #ffebee;
            border-color: #f44336;
        }
        .result-card { text-align: center; padding: 16px; }
        .score-circle {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background: linear-gradient(135deg, #1976d2, #42a5f5);
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 16px;
            font-size: 30px;
            font-weight: 700;
        }
        .student-info {
            background: #f5f5f5;
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 16px;
            font-size: 13px;
            line-height: 1.4;
        }
        .loading-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(255,255,255,0.8);
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 1001;
        }
        .loading-spinner {
            width: 40px;
            height: 40px;
            border: 4px solid #f3f3f3;
            border-top: 4px solid #1976d2;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .actions {
            display: flex;
            gap: 8px;
            justify-content: center;
            margin-top: 16px;
            flex-wrap: wrap;
        }
        /* 题目解析样式 */
        .analysis {
            margin-top: 8px;
            padding: 8px;
            background: #e3f2fd;
            border-radius: 6px;
            font-size: 12px;
            color: #0d47a1;
            line-height: 1.4;
        }
        /* 成绩等级样式 */
        .score-level {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 8px;
        }
        .level-excellent { color: #4caf50; }
        .level-good { color: #8bc34a; }
        .level-pass { color: #ff9800; }
        .level-fail { color: #f44336; }

        /* 数据大屏样式 */
        .header {display: flex;justify-content: space-between;align-items: center;padding-bottom: 15px;border-bottom: 1px solid #1f3a5f;margin-bottom: 20px;}
        .title {font-size: 26px;color: #4fc3f7;font-weight: bold;}
        .info-text {color: #90a4ae;}
        .container {display: grid;grid-template-columns: repeat(4,1fr);gap: 20px;margin-bottom: 20px;}
        .card {background: #112641;border: 1px solid #1f3a5f;border-radius: 8px;padding: 20px;text-align: center;}
        .card h4 {color: #90a4ae;font-size: 14px;margin-bottom: 10px;}
        .card .num {font-size: 38px;color: #4fc3f7;font-weight: bold;}
        .row-box {display: grid;grid-template-columns: 1fr;gap: 20px;}
        .big-card {background: #112641;border: 1px solid #1f3a5f;border-radius: 8px;padding: 20px;height: 300px;margin-bottom: 20px;}
        #accuracy-table {width: 100%;height: 100%;overflow: auto;display: block;}
        #accuracy-table th, #accuracy-table td {
            border-bottom: 1px solid #1f3a5f;
            padding: 12px 10px;
            text-align: left;
            font-size: 14px;
        }
        #accuracy-table th {color: #90a4ae;background: #162e4e;}
        #accuracy-table td {color: #e0e0e0;}
        #accuracy-table .high-error {color: #f44336; font-weight: 600;}
        #accuracy-table .good {color: #4fc3f7; font-weight: 600;}
        #accuracy-table .status-good {color: #4caf50;}
        #accuracy-table .status-error {color: #ff9800;}
        .rank-table {width: 100%;border-collapse: collapse;height: 100%;overflow: auto;display: block;}
        .rank-table th, .rank-table td {
            border-bottom: 1px solid #1f3a5f;
            padding: 10px;
            text-align: center;
            font-size: 14px;
        }
        .rank-table th {color: #90a4ae;}
        .rank-table td {color: #e0e0e0;}
        .refresh-tip {position: fixed;right: 20px;bottom: 20px;color: #4fc3f7;font-size: 12px;}

        /* 清除数据按钮样式 */
        .clear-data-btn {
            background: #f44336;
            color: #fff;
            border: none;
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            transition: background 0.2s;
        }
        .clear-data-btn:hover {
            background: #d32f2f;
        }

        /* 响应式适配 */
        @media (max-width: 1200px) {
            .main-container {
                flex-direction: column;
            }
            .quiz-section, .data-screen-section {
                min-width: 100%;
                max-width: 100%;
            }
            .data-screen-section {
                margin-top: 20px;
            }
            .row-box {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="main-container">
        <!-- 左侧答题区域 -->
        <div class="quiz-section">
            <div id="quizContainer" class="quiz-container">
                <div id="startScreen" class="screen active">
                    <h1>🌏 中国地理知识小测</h1>
                    <p class="subtitle">人教版 · 初中地理 · 共 5 题 · 限时 1 分钟 | 最多50人同时作答</p>
                    <div class="form-group">
                        <label>姓名 *</label>
                        <input type="text" id="userName" placeholder="请输入你的姓名">
                    </div>
                    <div class="form-group">
                        <label>学号 *</label>
                        <input type="text" id="userId" placeholder="请输入你的学号">
                    </div>
                    <div class="actions">
                        <button class="btn" id="startBtn">开始答题</button>
                    </div>
                </div>

                <div id="quizScreen" class="screen">
                    <div class="timer-bar">
                        <span class="timer-text">⏱ 剩余时间：<span id="timeLeft">60</span> 秒</span>
                        <span class="progress">第 <span id="curIdx">1</span> / 5 题</span>
                    </div>
                    <div id="qBox"></div>
                    <div class="actions">
                        <button class="btn" onclick="submitQuiz()">立即交卷</button>
                        <button class="btn btn-back" onclick="backToStart()">返回答题</button>
                    </div>
                </div>

                <div id="resultScreen" class="screen">
                    <div class="result-card">
                        <h1>🎉 提交成功</h1>
                        <div class="student-info"><span id="resultInfo"></span></div>
                        <div class="score-level" id="scoreLevel"></div>
                        <div class="score-circle"><span id="scoreNum">0</span></div>
                        <p>答题数据已同步至大屏</p>
                        <div id="analysisArea" style="margin: 16px 0; text-align: left;"></div>
                        <div class="actions">
                            <button class="btn btn-back" onclick="backToStart()">返回答题</button>
                        </div>
                    </div>
                </div>

                <div id="endScreen" class="screen">
                    <div class="result-card">
                        <h2>⏰ 时间到！</h2>
                        <p style="margin:16px 0">正在自动为您交卷...</p>
                        <div class="actions">
                            <button class="btn btn-back" onclick="backToStart()">返回答题</button>
                        </div>
                    </div>
                </div>
            </div>

            <div id="loading" class="loading-overlay">
                <div class="loading-spinner"></div>
                <p>正在提交数据，请稍候...</p>
            </div>
        </div>

        <!-- 右侧数据大屏区域 -->
        <div class="data-screen-section">
            <div class="header">
                <div class="title">答题情况实时大屏</div>
                <div style="display:flex;align-items:center;gap:12px;">
                    <div class="info-text">实时更新 | 地理答题统计</div>
                    <button class="clear-data-btn" onclick="clearAllData()">清空所有数据</button>
                </div>
            </div>

            <div class="container">
                <div class="card">
                    <h4>参与总人数</h4>
                    <div class="num" id="totalPeople">0</div>
                </div>
                <div class="card">
                    <h4>平均分</h4>
                    <div class="num" id="avgScore">0</div>
                </div>
                <div class="card">
                    <h4>最高分</h4>
                    <div class="num" id="maxScore">0</div>
                </div>
                <div class="card">
                    <h4>及格率(≥60分)</h4>
                    <div class="num" id="passRate">0%</div>
                </div>
            </div>

            <div class="row-box">
                <!-- 每题正确率统计表格 -->
                <div class="big-card">
                    <h4 style="color:#4fc3f7; margin-bottom:15px;">每题正确率统计</h4>
                    <table id="accuracy-table">
                        <thead>
                            <tr>
                                <th>题号</th>
                                <th>题目内容</th>
                                <th>正确率</th>
                                <th>状态</th>
                            </tr>
                        </thead>
                        <tbody id="accuracyBody"></tbody>
                    </table>
                </div>
                <div class="big-card">
                    <h4 style="color:#4fc3f7; margin-bottom:15px;">答题排行榜</h4>
                    <table class="rank-table">
                        <thead>
                            <tr>
                                <th>排名</th>
                                <th>姓名</th>
                                <th>学号</th>
                                <th>分数</th>
                                <th>用时(秒)</th>
                            </tr>
                        </thead>
                        <tbody id="rankBody"></tbody>
                    </table>
                </div>
            </div>

            <div class="refresh-tip">每2秒自动刷新数据</div>
        </div>
    </div>

    <script>
        // 最大作答人数
        const MAX_USER = 50;
        let quizResultData = [];
        let timer = null;
        let remainingTime = 60;
        
        // 题目数据
        const questions = [
            { 
                title: "我国的海岸线长度大约是？", 
                type: "radio",
                options: ["A. 约 1.4 万千米","B. 约 1.8 万千米","C. 约 2.2 万千米","D. 约 2.6 万千米"], 
                answer: 1,
                analysis: "我国大陆海岸线长达1.8万多千米，岛屿海岸线约1.4万千米，总计约3.2万千米。本题问的是海岸线总长的常用表述，核心答案为1.8万千米。"
            },
            { 
                title: "我国大陆濒临的海洋自北向南依次是？", 
                type: "radio",
                options: ["A. 渤海、黄海、东海、南海","B. 黄海、渤海、东海、南海","C. 东海、渤海、黄海、南海","D. 南海、东海、黄海、渤海"], 
                answer: 0,
                analysis: "我国濒临的海洋自北向南依次为渤海（内海）、黄海、东海、南海，总面积约470万平方千米。"
            },
            { 
                title: "我国管辖的海域面积大约是？", 
                type: "radio",
                options: ["A. 约 150 万平方千米","B. 约 300 万平方千米","C. 约 470 万平方千米","D. 约 960 万平方千米"], 
                answer: 1,
                analysis: "我国主张管辖的海域面积约300万平方千米（包括内水、领海、专属经济区等），陆地面积约960万平方千米。"
            },
            { 
                title: "我国跨越的温度带是哪两个？", 
                type: "radio",
                options: ["A. 热带、亚热带","B. 亚热带、北温带","C. 热带、北温带","D. 寒温带、北温带"], 
                answer: 2,
                analysis: "我国领土南北跨纬度很广，大部分位于中纬度地区，属北温带，南部少数地区位于北回归线以南的热带，没有寒带。"
            },
            { 
                title: "下列哪些河流自西向东注入海洋？（多选，请选择 3 个）", 
                type: "multi", 
                options: ["A. 长江","B. 黄河","C. 塔里木河","D. 珠江","E. 额尔齐斯河"], 
                answer: [0, 1, 3],
                analysis: "长江、黄河、珠江均自西向东注入太平洋；塔里木河是内流河，最终消失在塔克拉玛干沙漠；额尔齐斯河向北注入北冰洋。"
            }
        ];

        window.onload = function() {
            openQuiz();
            initScreenData();
            setInterval(initScreenData, 2000);
        }

        function openQuiz() {
            resetQuizStatus();
            const quizContainer = document.getElementById('quizContainer');
            quizContainer.style.display = 'block';
            document.getElementById('startBtn').onclick = startQuiz;
        }

        // 返回到初始信息页
        function backToStart(){
            if(timer) clearInterval(timer);
            timer = null;
            remainingTime = 60;
            document.getElementById('timeLeft').textContent = '60';
            document.getElementById('qBox').innerHTML = '';
            document.getElementById('analysisArea').innerHTML = '';
            document.querySelectorAll('.screen').forEach(el=>el.classList.remove('active'));
            document.getElementById('startScreen').classList.add('active');
        }

        function resetQuizStatus() {
            if(timer) clearInterval(timer);
            timer = null;
            remainingTime = 60;
            document.getElementById('startScreen').classList.add('active');
            document.getElementById('quizScreen').classList.remove('active');
            document.getElementById('resultScreen').classList.remove('active');
            document.getElementById('endScreen').classList.remove('active');
            document.getElementById('userName').value = '';
            document.getElementById('userId').value = '';
            document.getElementById('timeLeft').textContent = '60';
            document.getElementById('qBox').innerHTML = '';
            document.getElementById('analysisArea').innerHTML = '';
        }

        // 校验同一人是否重复作答
        function checkUserExist(name, id) {
            let allResults = JSON.parse(localStorage.getItem('quizAllResults') || '[]');
            let key = name.trim() + '|' + id.trim();
            for(let item of allResults){
                if(item.name + '|' + item.id === key){
                    return true;
                }
            }
            return false;
        }

        function startQuiz() {
            const userName = document.getElementById('userName').value.trim();
            const userId = document.getElementById('userId').value.trim();
            
            if(!userName || !userId) {
                alert('请输入姓名和学号！');
                return;
            }

            let allResults = JSON.parse(localStorage.getItem('quizAllResults') || '[]');
            if(allResults.length >= MAX_USER){
                alert(`当前作答人数已达上限（${MAX_USER}人），无法继续作答！`);
                return;
            }
            if(checkUserExist(userName, userId)){
                alert('该姓名+学号已完成答题，请勿重复作答！');
                return;
            }

            document.getElementById('startScreen').classList.remove('active');
            document.getElementById('quizScreen').classList.add('active');
            renderQuestions();
            startTimer();
        }

        // 渲染题目
        function renderQuestions() {
            const questionsArea = document.getElementById('qBox');
            questionsArea.innerHTML = '';
            
            questions.forEach((q, index) => {
                const questionCard = document.createElement('div');
                questionCard.className = 'question-card';

                const qTitle = document.createElement('div');
                qTitle.className = 'q-title';
                qTitle.innerHTML = `<span class="num">${index + 1}.</span>${q.title}`;
                questionCard.appendChild(qTitle);

                const optionsContainer = document.createElement('div');
                optionsContainer.className = 'options';

                q.options.forEach((optText, optIndex) => {
                    const label = document.createElement('label');
                    let inputType = q.type === 'multi' ? 'checkbox' : 'radio';
                    let inputName = q.type === 'multi' ? `q${index}_${optIndex}` : `q${index}`;
                    label.innerHTML = `<input type="${inputType}" name="${inputName}" value="${optIndex}"> ${optText}`;
                    optionsContainer.appendChild(label);
                });
                questionCard.appendChild(optionsContainer);
                questionsArea.appendChild(questionCard);
            });
        }

        // 倒计时
        function startTimer() {
            document.getElementById('timeLeft').textContent = remainingTime;
            timer = setInterval(() => {
                remainingTime--;
                document.getElementById('timeLeft').textContent = remainingTime;
                
                if(remainingTime <= 10) {
                    document.querySelector('.timer-text').style.color = '#f44336';
                    document.querySelector('.timer-text').style.fontSize = '16px';
                }
                
                if(remainingTime <= 0) {
                    clearInterval(timer);
                    timer = null;
                    document.getElementById('quizScreen').classList.remove('active');
                    document.getElementById('endScreen').classList.add('active');
                    setTimeout(submitQuiz, 2000);
                }
            }, 1000);
        }

        // 成绩等级
        function getScoreLevel(score) {
            if(score >= 90) return { text: "优秀", className: "level-excellent" };
            if(score >= 70) return { text: "良好", className: "level-good" };
            if(score >= 60) return { text: "及格", className: "level-pass" };
            return { text: "不及格", className: "level-fail" };
        }

        // 题目解析
        function renderAnalysis(userAnswers) {
            const analysisArea = document.getElementById('analysisArea');
            analysisArea.innerHTML = '<h3 style="font-size:14px; color:#1565c0; margin-bottom:8px; text-align:center;">📝 题目解析</h3>';
            questions.forEach((q, index) => {
                const ansCard = document.createElement('div');
                ansCard.className = 'question-card';
                ansCard.style.marginBottom = '8px';
                const qTitle = document.createElement('div');
                qTitle.className = 'q-title';
                qTitle.innerHTML = `<span class="num">${index + 1}.</span>${q.title}`;
                ansCard.appendChild(qTitle);

                const optionsContainer = document.createElement('div');
                optionsContainer.className = 'options';
                q.options.forEach((optText, optIndex) => {
                    const label = document.createElement('label');
                    label.textContent = optText;
                    let isCorrect = q.answer.includes(optIndex);
                    let isSelected = q.type === 'multi' 
                        ? (userAnswers[index] || []).includes(optIndex)
                        : userAnswers[index] === optIndex;

                    if(isCorrect) label.classList.add('correct');
                    else if(isSelected) label.classList.add('incorrect');
                    optionsContainer.appendChild(label);
                });
                ansCard.appendChild(optionsContainer);

                const analysisDiv = document.createElement('div');
                analysisDiv.className = 'analysis';
                analysisDiv.textContent = q.analysis;
                ansCard.appendChild(analysisDiv);
                analysisArea.appendChild(ansCard);
            });
        }

        // 交卷
        function submitQuiz() {
            document.getElementById('loading').style.display = 'flex';
            const userName = document.getElementById('userName').value.trim();
            const userId = document.getElementById('userId').value.trim();
            let userAnswers = [];
            let score = 0;
            let useTime = 60 - remainingTime;

            questions.forEach((q, index) => {
                if(q.type === 'multi'){
                    let checkboxes = document.querySelectorAll(`input[name^="q${index}_"]:checked`);
                    let selected = Array.from(checkboxes).map(cb => Number(cb.value));
                    userAnswers.push(selected);
                    let right = [...q.answer].sort().join(',');
                    let curr = [...selected].sort().join(',');
                    if(right === curr) score += 20;
                }else{
                    let radio = document.querySelector(`input[name="q${index}"]:checked`);
                    let selected = radio ? Number(radio.value) : -1;
                    userAnswers.push(selected);
                    if(selected === q.answer) score += 20;
                }
            });

            const quizData = {
                name: userName,
                id: userId,
                score: score,
                answers: userAnswers,
                useTime: useTime,
                submitTime: new Date().getTime(),
                submitTimeStr: new Date().toLocaleString()
            };

            let allResults = JSON.parse(localStorage.getItem('quizAllResults') || '[]');
            allResults.push(quizData);
            localStorage.setItem('quizAllResults', JSON.stringify(allResults));
            localStorage.setItem('quizData', JSON.stringify(allResults));

            setTimeout(() => {
                document.getElementById('loading').style.display = 'none';
                document.getElementById('quizScreen').classList.remove('active');
                document.getElementById('endScreen').classList.remove('active');
                document.getElementById('resultScreen').classList.add('active');

                document.getElementById('resultInfo').textContent = `姓名：${userName} | 学号：${userId} | 提交时间：${quizData.submitTimeStr}`;
                document.getElementById('scoreNum').textContent = score;
                const level = getScoreLevel(score);
                document.getElementById('scoreLevel').textContent = `成绩等级：${level.text}`;
                document.getElementById('scoreLevel').className = `score-level ${level.className}`;
                renderAnalysis(userAnswers);

                if(timer) timer = null;
            }, 1000);
        }

        // 计算每题正确率
        function calculateQuestionAccuracy(allResults) {
            const correctCount = [0, 0, 0, 0, 0];
            const totalParticipants = allResults.length;

            allResults.forEach(result => {
                questions.forEach((q, idx) => {
                    let isCorrect = false;
                    if(q.type === 'multi') {
                        const right = [...q.answer].sort().join(',');
                        const userAns = (result.answers[idx] || []).sort().join(',');
                        isCorrect = right === userAns;
                    } else {
                        isCorrect = result.answers[idx] === q.answer;
                    }
                    if(isCorrect) correctCount[idx]++;
                });
            });

            let accuracyHtml = '';
            correctCount.forEach((correctNum, idx) => {
                const accuracy = totalParticipants > 0 
                    ? ((correctNum / totalParticipants) * 100).toFixed(1) + '%' 
                    : '0.0%';
                let statusText = '掌握良好';
                let statusClass = 'status-good';
                let accuracyClass = 'good';
                
                const accuracyValue = parseFloat(accuracy);
                if(accuracyValue < 50) {
                    statusText = '高频错题';
                    statusClass = 'status-error';
                    accuracyClass = 'high-error';
                }

                accuracyHtml += `<tr>
                    <td>${idx + 1}</td>
                    <td>${questions[idx].title}</td>
                    <td class="${accuracyClass}">${accuracy}</td>
                    <td class="${statusClass}">${statusText}</td>
                </tr>`;
            });

            document.getElementById('accuracyBody').innerHTML = accuracyHtml;
        }

        // 大屏初始化
        function initScreenData(){
            let data = JSON.parse(localStorage.getItem("quizAllResults") || localStorage.getItem("quizData") || "[]");
            const total = data.length;
            let sumScore = 0, maxS = 0, passNum = 0;
            
            data.forEach(item=>{
                let s = item.score;
                sumScore += s;
                if(s>maxS) maxS = s;
                if(s>=60) passNum++;
            });
            
            let avg = total ? (sumScore / total).toFixed(1) : 0;
            let passRate = total ? ((passNum/total)*100).toFixed(1)+"%" : "0%";

            document.getElementById("totalPeople").innerText = total;
            document.getElementById("avgScore").innerText = avg;
            document.getElementById("maxScore").innerText = maxS;
            document.getElementById("passRate").innerText = passRate;

            calculateQuestionAccuracy(data);

            data.sort((a,b)=>{
                if(b.score !== a.score) return b.score - a.score;
                return (a.useTime||60)-(b.useTime||60);
            });
            let rankHtml = "";
            data.forEach((item,idx)=>{
                rankHtml += `<tr>
                    <td>${idx+1}</td>
                    <td>${item.name}</td>
                    <td>${item.id}</td>
                    <td style="color:#4fc3f7">${item.score}</td>
                    <td>${item.useTime||60}</td>
                </tr>`;
            });
            document.getElementById("rankBody").innerHTML = rankHtml;
        }

        // 清空数据
        function clearAllData() {
            let pwd = prompt("请输入管理员密码：");
            if(pwd !== "123"){
                alert("密码错误，无法清空数据！");
                return;
            }
            if (!confirm("确定要清空所有答题数据吗？清空后无法恢复！")) return;

            localStorage.removeItem("quizData");
            localStorage.removeItem("quizAllResults");
            initScreenData();
            resetQuizStatus();
            alert("数据已成功清空，答题功能已恢复初始状态！");
        }
    </script>
