<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>海洋分析师 专属证书</title>
    <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Microsoft YaHei", "SimSun", sans-serif;
        }

        body {
            background: linear-gradient(120deg, #e3f2fd, #c8e1ff);
            padding: 25px 15px;
            text-align: center;
            position: relative; /* 新增：为全屏按钮定位做准备 */
        }

        /* 新增：全屏按钮样式 */
        .fullscreen-btn {
            position: absolute;
            top: 25px;
            right: 25px;
            padding: 10px 20px;
            background: transparent; /* 透明背景 */
            color: transparent; /* 透明文字 */
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 14px;
            z-index: 9999; /* 确保在最上层 */
        }
        .fullscreen-btn:hover {
            background: #0a3d8f; /* 悬浮时显示背景色 */
            color: #fff; /* 悬浮时显示文字 */
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
        }

        .page-title {
            font-size: 24px;
            color: #0a3d8f;
            margin-bottom: 8px;
            font-weight: bold;
        }

        .page-desc {
            font-size: 14px;
            color: #1967d2;
            margin-bottom: 28px;
        }

        input {
            padding: 11px 18px;
            width: 270px;
            font-size: 15px;
            border: 2px solid #1967d2;
            border-radius: 8px;
            outline: none;
            text-align: center;
            background: #fff;
        }

        button {
            padding: 11px 26px;
            background: #0a3d8f;
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            margin-left: 10px;
            cursor: pointer;
            transition: background 0.2s;
        }

        button:hover {
            background: #083073;
        }

        /* 证书整体美化 */
        .certificate {
            width: 100%;
            max-width: 520px;
            margin: 30px auto 0;
            background: #fff;
            /* 双层边框更精致 */
            border: 8px double #0a3d8f;
            padding: 35px 30px;
            border-radius: 18px;
            box-shadow: 0 4px 25px rgba(10, 61, 143, 0.18);
            display: none;
            position: relative;
            /* 浅纹理底纹 */
            background-image: repeating-linear-gradient(45deg, #f7f9fc 0px, #f7f9fc 1px, transparent 1px, transparent 10px);
        }

        /* 顶部对称装饰 */
        .cert-top-decor {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 18px;
            margin-bottom: 22px;
        }
        .decor-line {
            width: 80px;
            height: 2px;
            background-color: #0a3d8f;
        }
        .decor-wave {
            font-size: 24px;
            color: #0a3d8f;
        }

        .cert-title {
            font-size: 28px;
            color: #0a3d8f;
            margin-bottom: 8px;
            font-weight: bold;
            letter-spacing: 2px;
        }

        .cert-eng {
            font-size: 13px;
            color: #446cad;
            letter-spacing: 1px;
            margin-bottom: 25px;
        }

        .name-box {
            font-size: 34px;
            color: #b81c1c;
            font-weight: bold;
            margin: 28px 0;
            border-bottom: 2px solid #1967d2;
            display: inline-block;
            padding: 0 25px 8px;
            letter-spacing: 3px;
        }

        .cert-text {
            font-size: 16px;
            line-height: 1.8;
            color: #2c3e50;
            margin-bottom: 18px;
        }

        .cert-tag {
            font-size: 19px;
            font-weight: bold;
            color: #0a3d8f;
            margin: 10px 0 22px;
        }

        /* 签章区域 */
        .sign {
            position: relative;
            width: 200px;
            height: 105px;
            margin: 35px auto 0;
            text-align: center;
        }
        .sign-text {
            font-size: 16px;
            font-weight: bold;
            color: #0a3d8f;
            line-height: 105px;
        }
        /* 替换为新版印章 */
        .seal {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 130px;
            height: 130px;
            background-image: url('https://p11-flow-imagex-sign.byteimg.com/tos-cn-i-a9rns2rl98/916de63e58954e16a0c060241da150b7.png~tplv-a9rns2rl98-24:720:720.jpeg?lk3s=8e244e95&rcl=2026061111433565E12C8CD1A224F8B4C6&rrcfp=d52e923b&x-expires=1781754215&x-signature=19ASMIrOxL5Pn2VCM6NtMSBJ2cg%3D');
            background-size: cover;
            z-index: 10;
            opacity: 0.95;
        }

        .date {
            margin-top: 12px;
            font-size: 14px;
            color: #506685;
        }

        .download-btn {
            margin-top: 22px;
            background: #2e7d32;
        }
        .download-btn:hover {
            background: #1b5e20;
        }
    </style>
</head>

<body>
    <!-- 新增：全屏按钮 -->
    <button class="fullscreen-btn" onclick="toggleFullScreen()">全屏</button>

    <div class="container">
        <h1 class="page-title">海洋资源分析师 认证中心</h1>
        <p class="page-desc">输入姓名，生成并下载专属证书</p>

        <div>
            <input type="text" id="username" placeholder="请输入你的姓名">
            <button onclick="createCert()">生成证书</button>
        </div>

        <!-- 美化后证书 -->
        <div class="certificate" id="cert">
            <div class="cert-top-decor">
                <div class="decor-line"></div>
                <div class="decor-wave">〰️</div>
                <div class="decor-line"></div>
            </div>

            <h2 class="cert-title">荣誉证书</h2>
            <p class="cert-eng">CERTIFICATE OF MARINE ANALYST</p>

            <p class="cert-text">兹授予</p>
            <div class="name-box" id="showName">姓名</div>

            <p class="cert-tag">官方认证 · 海洋分析师</p>

            <p class="cert-text">
                特发此证，以资鼓励<br>
                探索海洋奥秘，守护蓝色星球
            </p>

            <div class="sign">
                <div class="sign-text">海洋资源教研中心</div>
                <div class="seal"></div>
            </div>

            <div class="date" id="nowDate"></div>
        </div>

        <button class="download-btn" id="downloadBtn" style="display:none;" onclick="downloadCert()">下载证书</button>
    </div>

    <script>
        // 新增：全屏切换函数
        function toggleFullScreen() {
            let doc = document.documentElement;
            if (!document.fullscreenElement) {
                // 进入全屏
                if (doc.requestFullscreen) {
                    doc.requestFullscreen();
                } else if (doc.webkitRequestFullscreen) { // 兼容webkit内核
                    doc.webkitRequestFullscreen();
                } else if (doc.msRequestFullscreen) { // 兼容IE/Edge
                    doc.msRequestFullscreen();
                }
                document.querySelector('.fullscreen-btn').innerText = '退出全屏';
            } else {
                // 退出全屏
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                } else if (document.webkitExitFullscreen) {
                    document.webkitExitFullscreen();
                } else if (document.msExitFullscreen) {
                    document.msExitFullscreen();
                }
                document.querySelector('.fullscreen-btn').innerText = '全屏';
            }
        }

        function createCert() {
            let name = document.getElementById('username').value.trim();
            if (!name) {
                alert('请输入姓名');
                return;
            }
            document.getElementById('showName').innerText = name;
            document.getElementById('cert').style.display = 'block';
            document.getElementById('downloadBtn').style.display = 'inline-block';

            let date = new Date();
            let y = date.getFullYear();
            let m = date.getMonth() + 1;
            let d = date.getDate();
            document.getElementById('nowDate').innerText = `${y}年${m}月${d}日`;
        }

        function downloadCert() {
            html2canvas(document.getElementById('cert'), {
                useCORS: true,
                scale: 2
            }).then(canvas => {
                let a = document.createElement('a');
                a.download = "海洋分析师证书.png";
                a.href = canvas.toDataURL('image/png');
                a.click();
            });
        }
    </script>
</body>
</html>
